plugins {
    id 'com.android.application'
}

android {
    namespace 'app.hearth.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'app.hearth.launcher'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
